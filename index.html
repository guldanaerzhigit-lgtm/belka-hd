<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b2c20"><title>Belka HD</title><style>
*{box-sizing:border-box}body{margin:0;background:#100d09;color:#f7e9c8;font-family:Georgia,serif}button{cursor:pointer;border:1px solid #d0ad60;border-radius:11px;padding:11px 14px;color:#ffe9b8;background:linear-gradient(#49341c,#1b1209);font:bold 13px Arial;box-shadow:0 3px #090604}button:active{transform:translateY(2px)}#app{height:100dvh;min-height:500px;overflow:hidden;background:radial-gradient(ellipse,#4a3018,#160f09 65%,#070605)}#menu{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.logo{font-size:clamp(60px,14vw,105px);letter-spacing:.12em;margin:0;color:#f7e5b7;text-shadow:0 4px #b8873d,0 10px #382411,0 16px 28px #000}.sub{font:12px Arial;letter-spacing:.25em;color:#c7a45e;margin:12px 0 30px}.menus{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.menus button{width:145px;height:115px;font-size:17px;border-width:2px}.note{font:12px/1.5 Arial;color:#c5b595;margin-top:22px;max-width:370px}#game{display:none;height:100%;position:relative;background:radial-gradient(ellipse,#28734e,#155039 52%,#08271c);isolation:isolate}#game:before{content:"";position:absolute;inset:9px;border:2px solid #c7a55d;border-radius:38%/25%;box-shadow:inset 0 0 0 5px #08251a,inset 0 0 45px #00180d;pointer-events:none;z-index:-1}.topbar{position:absolute;z-index:4;top:9px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}.pill{font:bold 12px Arial;color:#ffe4a0;background:#09271e;border:1px solid #d2b15f;border-radius:30px;padding:8px 12px}.seat{position:absolute;z-index:1;min-width:90px;text-align:center;font:bold 11px Arial;color:#f8e7c2;text-shadow:0 2px 3px #000}.seat small{display:block;font-weight:normal;color:#c4d6b9;margin-top:3px}.top{top:58px;left:50%;transform:translateX(-50%)}.left{left:5px;top:40%}.right{right:5px;top:40%}.backs{display:flex;justify-content:center;margin-top:5px}.back{width:23px;height:34px;margin-left:-8px;border:2px solid #dfc47e;border-radius:5px;background:repeating-linear-gradient(45deg,#174b39 0 4px,#c9a85e 4px 6px);box-shadow:0 2px 4px #001}.back:first-child{margin-left:0}#score{position:absolute;top:11%;left:50%;transform:translateX(-50%);white-space:nowrap;font:11px Arial;color:#f5dfaa;text-shadow:0 1px 4px #000}#message{position:absolute;z-index:2;top:17%;left:50%;transform:translateX(-50%);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#06251ce8;border:1px solid #c8a657;border-radius:22px;padding:8px 12px;font:12px Arial}.zone{position:absolute;left:12%;right:12%;top:23%;bottom:28%;display:flex;align-items:center;justify-content:center}.oval{position:absolute;inset:0;border:1px solid #a4d0a24d;border-radius:50%;box-shadow:inset 0 0 30px #002b1c}.plays{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,auto);gap:8px}.slot{position:relative;width:clamp(55px,16vw,94px);height:clamp(82px,23vw,138px)}.slotname{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font:10px Arial;color:#fff0c7;text-shadow:0 1px 3px #000;white-space:nowrap}.card{width:100%;height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:5px;border-radius:9px;border:1px solid #d5c39d;background:linear-gradient(135deg,#fffdf4,#e8ddc4 72%,#d0bc92);color:#20221e;box-shadow:0 5px 12px #00150c9c;user-select:none;touch-action:pan-y}.card:after{content:"";position:absolute;inset:3px;border:1px solid #b9a781;border-radius:6px;pointer-events:none}.red{color:#b52a34}.corner{font-weight:bold;font-size:clamp(12px,3.2vw,20px);line-height:1;z-index:1}.corner span{font-size:.85em}.pip{align-self:center;font-size:clamp(28px,7vw,44px);z-index:1}.bottom{align-self:flex-end;transform:rotate(180deg)}.handwrap{position:absolute;bottom:5px;left:0;right:0;height:clamp(140px,26vh,195px);display:flex;align-items:flex-end;padding:0 5px 10px}.hand{display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%}.hand .card{width:clamp(41px,11.5vw,76px);height:clamp(76px,18.5vh,124px);margin-left:clamp(-23px,-4vw,-7px);flex-shrink:0;cursor:pointer;transition:transform .15s}.hand .card:first-child{margin-left:0}.hand .selected{transform:translateY(-19px);outline:3px solid #f3d16d;z-index:3}.hand .corner{font-size:clamp(11px,3vw,17px)}.hand .pip{font-size:clamp(22px,6vw,37px)}.controls{position:absolute;z-index:3;bottom:clamp(140px,26vh,198px);left:0;right:0;display:flex;justify-content:center;gap:6px}.controls button{font-size:10px;padding:10px 11px}#toast{position:absolute;z-index:3;bottom:clamp(203px,34vh,252px);left:50%;transform:translateX(-50%);font:bold 12px Arial;color:#ffefb7;text-shadow:0 2px 4px #000;white-space:nowrap}.modal{display:none;position:absolute;inset:0;z-index:10;background:#000b;align-items:center;justify-content:center;padding:20px}.box{width:min(370px,100%);background:linear-gradient(#302316,#100c08);border:2px solid #d2ae5d;border-radius:18px;padding:22px;text-align:center}.box h2{color:#f4d58d}.box p{font:14px/1.55 Arial;color:#e0d2b5;white-space:pre-line}@media(min-width:760px){.zone{left:28%;right:28%}.slot{width:95px;height:140px}.handwrap{height:190px}.controls{bottom:194px}.left{left:18%}.right{right:18%}}
</style></head><body><div id="app"><section id="menu"><h1 class="logo">БЕЛКА</h1><div class="sub">HD · КАРТОЧНЫЙ СТОЛ</div><div class="menus"><button id="start">♠<br>Новая игра<br><small>против ботов</small></button><button id="rules">♜<br>Правила<br><small>и управление</small></button></div><div class="note">4 игрока · 32 карты · команды по двое<br>Важно: это играбельный прототип; региональные правила Белки могут отличаться.</div></section>
<section id="game"><div class="topbar"><button id="home">⌂</button><div class="pill" id="trump">КОЗЫРЬ ♣</div><button id="help">?</button></div><div class="seat top">МОЙША<small>соперник</small><div class="backs" id="b2"></div></div><div class="seat left">ФРАЕРОК<small>соперник</small><div class="backs" id="b1"></div></div><div class="seat right">ПАРТНЁР<small>твоя команда</small><div class="backs" id="b3"></div></div><div id="score">Команда 1: 0 · Команда 2: 0</div><div id="message">Твой ход</div><div class="zone"><div class="oval"></div><div class="plays" id="table"></div></div><div id="toast"></div><div class="controls"><button id="play">▶ СЫГРАТЬ</button><button id="sort">↕ СОРТИРОВАТЬ</button><button id="deal">↻ НОВАЯ СДАЧА</button></div><div class="handwrap"><div class="hand" id="hand"></div></div></section><div class="modal" id="modal"><div class="box"><h2 id="mt"></h2><p id="mp"></p><button id="close">ПОНЯТНО</button></div></div></div>
<script>
const S=['♠','♥','♦','♣'],R=['7','8','9','10','J','Q','K','A'],N=['ТЫ','ФРАЕРОК','МОЙША','ПАРТНЁР'];const $=id=>document.getElementById(id);
let G={hands:[],trump:'♣',turn:0,lead:0,trick:[],scores:[0,0],tricks:[0,0],sel:-1,locked:false};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){G={hands:[[],[],[],[]],trump:S[Math.random()*4|0],turn:Math.random()*4|0,lead:0,trick:[],scores:[0,0],tricks:[0,0],sel:-1,locked:false};let d=shuffle(S.flatMap(s=>R.map(r=>({s,r,id:r+s}))));for(let i=0;i<32;i++)G.hands[i%4].push(d[i]);G.hands.forEach(h=>h.sort((a,b)=>S.indexOf(a.s)-S.indexOf(b.s)||R.indexOf(a.r)-R.indexOf(b.r)));G.lead=G.turn;$('menu').style.display='none';$('game').style.display='block';paint();say(G.turn===0?'Твой ход':N[G.turn]+' начинает');if(G.turn!==0){G.locked=true;setTimeout(botStep,600)}}
function card(c,i,sel=false){return '<div class="card '+('♥♦'.includes(c.s)?'red ':'')+(sel?'selected':'')+'" data-i="'+i+'"><div class="corner">'+c.r+'<br><span>'+c.s+'</span></div><div class="pip">'+c.s+'</div><div class="corner bottom">'+c.r+'<br><span>'+c.s+'</span></div></div>'}
function paint(){ $('hand').innerHTML=G.hands[0].map((c,i)=>card(c,i,i===G.sel)).join('');[...$('hand').children].forEach(el=>{el.onclick=()=>{if(G.locked)return;G.sel=+el.dataset.i;paint()};let x=0;el.ontouchstart=e=>x=e.touches[0].clientX;el.ontouchend=e=>{if(Math.abs(e.changedTouches[0].clientX-x)>55){G.sel=+el.dataset.i;humanPlay()}}});$('table').innerHTML=G.trick.map(t=>'<div class="slot">'+card(t.c,-1)+'<span class="slotname">'+N[t.p]+'</span></div>').join('');[1,2,3].forEach(p=>$('b'+p).innerHTML=G.hands[p].map(()=>'<span class="back"></span>').join(''));$('trump').textContent='КОЗЫРЬ '+G.trump;$('score').textContent='Команда 1: '+G.scores[0]+' ('+G.tricks[0]+' вз.) · Команда 2: '+G.scores[1]+' ('+G.tricks[1]+' вз.)';$('play').disabled=G.locked||G.turn!==0||G.sel<0}
function say(s){$('message').textContent=s}
function legal(p){let h=G.hands[p];if(!G.trick.length)return h.slice();let s=G.trick[0].c.s;let same=h.filter(c=>c.s===s);return same.length?same:h.slice()}
function strength(c,lead){if(c.s===G.trump)return 100+R.indexOf(c.r);if(c.s===lead)return 20+R.indexOf(c.r);return R.indexOf(c.r)}
function add(p,c){let ix=G.hands[p].findIndex(x=>x.id===c.id);if(ix<0)return;G.hands[p].splice(ix,1);G.trick.push({p,c});G.sel=-1;G.turn=(p+1)%4;paint();if(G.trick.length===4){G.locked=true;say('Считаем взятку…');setTimeout(resolve,700)}else if(G.turn===0){G.locked=false;say('Твой ход — выбери карту');paint()}else{G.locked=true;say(N[G.turn]+' ходит…');setTimeout(botStep,450+Math.random()*350)}}
function humanPlay(){if(G.locked||G.turn!==0||G.sel<0)return;let c=G.hands[0][G.sel];if(!legal(0).some(x=>x.id===c.id)){say('Нужно положить карту масти захода');return}add(0,c)}
function choose(p){let l=legal(p);if(!G.trick.length){let non=l.filter(c=>c.s!==G.trump);return (non.length?non:l).sort((a,b)=>R.indexOf(a.r)-R.indexOf(b.r))[0]}let lead=G.trick[0].c.s;let best=G.trick.reduce((a,t)=>strength(t.c,lead)>strength(a.c,lead)?t:a,G.trick[0]);let win=l.filter(c=>strength(c,lead)>strength(best.c,lead));let partnerAhead=G.trick.some(t=>t.p%2===p%2&&strength(t.c,lead)===strength(best.c,lead));if(partnerAhead||!win.length)return l.slice().sort((a,b)=>strength(a,lead)-strength(b,lead))[0];return win.sort((a,b)=>strength(a,lead)-strength(b,lead))[0]}
function botStep(){if(!G.locked)return;if(G.turn===0){G.locked=false;say('Твой ход — выбери карту');paint();return}if(G.trick.length>=4){resolve();return}let p=G.turn;add(p,choose(p))}
function resolve(){if(G.trick.length!==4)return;let lead=G.trick[0].c.s;let w=G.trick.reduce((a,t)=>strength(t.c,lead)>strength(a.c,lead)?t:a,G.trick[0]);let team=w.p%2;let pts=G.trick.reduce((n,t)=>n+({'A':11,'10':10,'K':4,'Q':3,'J':2}[t.c.r]||0),0);G.scores[team]+=pts;G.tricks[team]++;G.lead=w.p;G.turn=w.p;G.trick=[];G.locked=false;$('toast').textContent=N[w.p]+' взял взятку · +'+pts;paint();if(G.hands.every(h=>h.length===0)){G.scores[team]+=10;let result=G.scores[0]===G.scores[1]?'Ничья':G.scores[0]>G.scores[1]?'Победа твоей команды!':'Победа соперников';modal('Раунд завершён',result+'\nКоманда 1: '+G.scores[0]+' очков\nКоманда 2: '+G.scores[1]+' очков\nВзятки: '+G.tricks[0]+' : '+G.tricks[1]);return}say(team===0?'Взятка твоей команды':'Взятка соперников');setTimeout(()=>{if(G.turn===0){say('Твой ход');paint()}else{G.locked=true;botStep()}},700)}
function sortHand(){G.hands[0].sort((a,b)=>S.indexOf(a.s)-S.indexOf(b.s)||R.indexOf(a.r)-R.indexOf(b.r));G.sel=-1;paint()}
function modal(t,p){$('mt').textContent=t;$('mp').textContent=p;$('modal').style.display='flex'}
$('start').onclick=newGame;$('deal').onclick=newGame;$('play').onclick=humanPlay;$('sort').onclick=sortHand;$('home').onclick=()=>{$('game').style.display='none';$('menu').style.display='flex'};$('rules').onclick=()=>modal('Правила и управление','Четыре игрока, две команды, 32 карты — каждому по 8. Ходи в масть первой карты взятки, если такая масть есть. Козырь побеждает некозырную карту. Внутри масти старшинство в этой версии: 7 < 8 < 9 < 10 < J < Q < K < A. Очки: A=11, 10=10, K=4, Q=3, J=2; последняя взятка +10. Это базовая игровая модель, не гарантия совпадения с каждым региональным вариантом Белки.');$('help').onclick=()=>modal('Подсказка','Выбери карту и нажми «Сыграть» или свайпни по карте. Если есть масть захода, нужно ходить в масть. Боты следуют масти и стараются брать взятки.');$('close').onclick=()=>$('modal').style.display='none';
</script></body></html>
