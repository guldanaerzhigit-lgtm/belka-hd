<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17120d"><title>Belka HD</title>
<style>
:root{--gold:#d9ad55}*{box-sizing:border-box}body{margin:0;background:#100d0a;color:#f7ebd0;font-family:Georgia,serif}button{cursor:pointer;color:inherit;border:1px solid #b58a42;background:linear-gradient(#3b2a18,#17120d);border-radius:12px;padding:12px 18px}#app{height:100dvh;min-height:480px;background:radial-gradient(ellipse,#4b2d16,#1b120b 60%,#080706);overflow:hidden}#menu{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.logo{font-size:clamp(55px,13vw,100px);font-weight:bold;letter-spacing:.12em;color:#f1dfb4;text-shadow:0 4px #9a6a2e,0 9px #21150d;margin-bottom:12px}.subtitle{color:#c5a66b;letter-spacing:.2em;margin-bottom:30px}.bigbtn{min-width:155px;min-height:115px;font-size:21px;margin:6px;border:2px solid var(--gold);background:linear-gradient(135deg,#4a311b,#17110b)}.small{font:14px Arial;color:#c9b99a;margin-top:25px}#game{display:none;height:100%;position:relative;background:radial-gradient(ellipse at center,#d7c59b,#a9956d 65%,#473d2a)}.topbar{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}.iconbtn{border-radius:50%;width:44px;height:44px;padding:0;font-size:20px;background:#251a11}.trump{background:#1c1914;border:2px solid var(--gold);padding:8px 12px;border-radius:30px;color:#f3d890;font:bold 14px Arial}.seat{position:absolute;color:#33291c;text-align:center;font:bold 13px Arial}.top{top:65px;left:50%;transform:translateX(-50%)}.left{left:5px;top:43%;writing-mode:vertical-rl;transform:rotate(180deg)}.right{right:5px;top:43%;writing-mode:vertical-rl}.backs{font-size:28px;color:#315b4a;letter-spacing:-12px}.play-area{position:absolute;left:10%;right:10%;top:24%;bottom:28%;display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #6c5734a8;border-radius:48%;background:#ffffff12}.card{background:linear-gradient(145deg,#fff5df,#d7c6a2);color:#211b13;border:1px solid #7d6a4b;border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;padding:5px;box-shadow:0 3px 8px #0005;user-select:none;touch-action:pan-y}.red{color:#9b2a1c}.played{width:clamp(54px,15vw,95px);height:clamp(82px,22vw,140px)}.rank{font-size:clamp(13px,3.5vw,21px);line-height:1}.suit{font-size:20px}.center{text-align:center;font-size:clamp(25px,7vw,42px);align-self:center}.bottom{transform:rotate(180deg);align-self:flex-end}.hand-wrap{position:absolute;bottom:8px;left:0;right:0;height:clamp(145px,27vh,205px);display:flex;align-items:flex-end;padding:0 8px 12px}.hand{display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%}.hand .card{width:clamp(43px,11.5vw,78px);height:clamp(78px,19vh,128px);margin-left:clamp(-24px,-4vw,-8px);flex-shrink:0;cursor:pointer;position:relative;transition:transform .15s}.hand .card:first-child{margin-left:0}.hand .selected{transform:translateY(-20px);outline:3px solid #e2b44e;z-index:3}.controls{position:absolute;bottom:clamp(145px,27vh,205px);left:0;right:0;display:flex;justify-content:center;gap:8px}.controls button{font: bold 13px Arial;padding:10px}#message{position:absolute;top:17%;left:50%;transform:translateX(-50%);background:#17120dd9;border:1px solid var(--gold);padding:8px 12px;border-radius:20px;font:13px Arial;white-space:nowrap}#score{position:absolute;right:14px;bottom:clamp(215px,34vh,260px);color:#2a2117;font:bold 13px Arial}.modal{display:none;position:absolute;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.box{max-width:350px;background:#21150d;border:2px solid var(--gold);border-radius:16px;padding:20px;text-align:center}.box p{font:14px/1.5 Arial;color:#dfd0b0}@media(min-width:800px){.play-area{left:25%;right:25%}.hand-wrap{height:190px}.controls{bottom:195px}}
</style></head><body><div id="app"><section id="menu"><div class="logo">БЕЛКА</div><div class="subtitle">КАРТОЧНАЯ ИГРА · HD</div><div><button class="bigbtn" id="start">🐿️<br>Одиночная<br>игра</button><button class="bigbtn" id="rules">📜<br>Правила</button></div><div class="small">Демо-версия · 32 карты · игра против ботов</div></section>
<section id="game"><div class="topbar"><button class="iconbtn" id="home">☰</button><div class="trump" id="trump">КОЗЫРЬ: ♣</div><button class="iconbtn" id="help">?</button></div><div class="seat top">БАТЬКА МОЙША<div class="backs">▰ ▰ ▰ ▰ ▰</div></div><div class="seat left">ФРАЕРОК<div class="backs">▰ ▰ ▰</div></div><div class="seat right">ПОПУГАЙЧИК<div class="backs">▰ ▰ ▰</div></div><div id="message">Твой ход — выбери карту</div><div class="play-area" id="table"></div><div id="score">Взятки: <span id="tricks">0</span></div><div class="controls"><button id="play">СЫГРАТЬ КАРТУ</button><button id="sort">СОРТИРОВАТЬ</button></div><div class="hand-wrap"><div class="hand" id="hand"></div></div></section>
<div class="modal" id="modal"><div class="box"><h2 id="mt">Правила</h2><p id="mp"></p><button id="close">ПОНЯТНО</button></div></div></div>
<script>
const suits=['♠','♥','♦','♣'],ranks=['7','8','9','10','J','Q','K','A'];let deck=[],hand=[],selected=-1,table=[],tricks=0,trump='♣',locked=false;const $=x=>document.getElementById(x);
function shuffled(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){deck=shuffled(suits.flatMap(s=>ranks.map(r=>({s,r}))));hand=deck.splice(0,8);table=[];tricks=0;selected=-1;locked=false;trump=suits[Math.random()*4|0];$('trump').textContent='КОЗЫРЬ: '+trump;$('menu').style.display='none';$('game').style.display='block';$('table').innerHTML='';$('tricks').textContent='0';$('message').textContent='Твой ход — выбери карту';render()}
function card(c,i,cls=''){return '<div class="card '+('♥♦'.includes(c.s)?'red ':'')+cls+'" data-i="'+i+'"><div><div class="rank">'+c.r+'</div><div class="suit">'+c.s+'</div></div><div class="center">'+c.s+'</div><div class="rank bottom">'+c.r+'<br>'+c.s+'</div></div>'}
function render(){ $('hand').innerHTML=hand.map((c,i)=>card(c,i,i===selected?'selected':'')).join('');[...$('hand').children].forEach(el=>{el.onclick=()=>{selected=+el.dataset.i;render()};let x=0;el.ontouchstart=e=>x=e.touches[0].clientX;el.ontouchend=e=>{if(Math.abs(e.changedTouches[0].clientX-x)>55){selected=+el.dataset.i;play()}}});$('table').innerHTML=table.map((c,i)=>'<div class="played">'+card(c,i)+'</div>').join('')}
function play(){if(selected<0||locked)return;table.push(hand.splice(selected,1)[0]);selected=-1;render();locked=true;$('message').textContent='Соперники ходят…';setTimeout(()=>{for(let i=0;i<3;i++)table.push(deck.length?deck.pop():{s:suits[Math.random()*4|0],r:ranks[Math.random()*8|0]});render();setTimeout(()=>{tricks++;$('tricks').textContent=tricks;$('message').textContent='Взятка завершена';table=[];$('table').innerHTML='';if(!hand.length){deck=shuffled(suits.flatMap(s=>ranks.map(r=>({s,r}))));hand=deck.splice(0,8);$('message').textContent='Новая раздача'}locked=false;render();},900)},500)}
function sort(){hand.sort((a,b)=>suits.indexOf(a.s)-suits.indexOf(b.s)||ranks.indexOf(a.r)-ranks.indexOf(b.r));selected=-1;render()}
function modal(t,p){$('mt').textContent=t;$('mp').textContent=p;$('modal').style.display='flex'}
$('start').onclick=start;$('play').onclick=play;$('sort').onclick=sort;$('home').onclick=()=>{$('game').style.display='none';$('menu').style.display='flex'};$('rules').onclick=()=>modal('Правила','Демо-прототип Belka HD: 32 карты, выбор козыря, касание или свайп для розыгрыша. Правила взяток и подсчёт очков пока упрощены.');$('help').onclick=()=>modal('Управление','Нажми на карту и выбери «Сыграть карту» или свайпни по карте. Сортировка упорядочивает карты по мастям.');$('close').onclick=()=>$('modal').style.display='none';
</script></body></html>
