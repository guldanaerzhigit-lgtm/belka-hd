<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b2b20"><title>Belka HD</title>
<style>
:root{--gold:#e3bf6c;--felt:#176044;--back:#164b3a}*{box-sizing:border-box}body{margin:0;background:#100d09;color:#f7e9c8;font-family:Georgia,serif}button,select,input{font:600 13px Arial}button{cursor:pointer;border:1px solid var(--gold);border-radius:11px;padding:10px 13px;color:#ffedc4;background:linear-gradient(#49341c,#1b1209);box-shadow:0 3px #090604}button:active{transform:translateY(2px)}button:disabled{opacity:.4}#app{height:100dvh;min-height:500px;overflow:hidden;background:radial-gradient(ellipse,#4a3018,#160f09 65%,#070605)}#menu{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.logo{font-size:clamp(58px,14vw,104px);letter-spacing:.12em;margin:0;color:#f7e5b7;text-shadow:0 4px #b8873d,0 10px #382411,0 16px 28px #000}.sub{font:12px Arial;letter-spacing:.25em;color:#c7a45e;margin:12px 0 25px}.menus{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.menus button{width:142px;height:105px;font-size:17px;border-width:2px}.note{font:12px/1.5 Arial;color:#c5b595;margin-top:22px;max-width:370px}#game{display:none;height:100%;position:relative;background:radial-gradient(ellipse,#28734e,#155039 52%,#08271c);isolation:isolate}#game:before{content:"";position:absolute;inset:9px;border:2px solid #c7a55d;border-radius:38%/25%;box-shadow:inset 0 0 0 5px #08251a,inset 0 0 45px #00180d;pointer-events:none;z-index:-1}.topbar{position:absolute;z-index:4;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center}.pill{font:bold 12px Arial;color:#ffe4a0;background:#09271e;border:1px solid #d2b15f;border-radius:30px;padding:8px 10px}.seat{position:absolute;z-index:1;min-width:85px;text-align:center;font:bold 10px Arial;color:#f8e7c2;text-shadow:0 2px 3px #000}.seat small{display:block;font-weight:normal;color:#c4d6b9;margin-top:3px}.top{top:54px;left:50%;transform:translateX(-50%)}.left{left:4px;top:39%}.right{right:4px;top:39%}.backs{display:flex;justify-content:center;margin-top:4px}.back{width:21px;height:31px;margin-left:-8px;border:2px solid #dfc47e;border-radius:5px;background:repeating-linear-gradient(45deg,var(--back) 0 4px,#c9a85e 4px 6px);box-shadow:0 2px 4px #001}.back:first-child{margin-left:0}#score{position:absolute;top:10.5%;left:50%;transform:translateX(-50%);white-space:nowrap;font:10px Arial;color:#f5dfaa;text-shadow:0 1px 4px #000}#message{position:absolute;z-index:2;top:16%;left:50%;transform:translateX(-50%);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#06251ce8;border:1px solid #c8a657;border-radius:22px;padding:7px 11px;font:11px Arial}.zone{position:absolute;left:12%;right:12%;top:23%;bottom:28%;display:flex;align-items:center;justify-content:center}.oval{position:absolute;inset:0;border:1px solid #a4d0a24d;border-radius:50%;box-shadow:inset 0 0 30px #002b1c}.plays{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,auto);gap:7px}.slot{position:relative;width:clamp(53px,15vw,90px);height:clamp(80px,22vw,132px);animation:drop .24s ease-out}.slotname{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font:9px Arial;color:#fff0c7;text-shadow:0 1px 3px #000;white-space:nowrap}.card{width:100%;height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:5px;border-radius:9px;border:1px solid #d5c39d;background:linear-gradient(135deg,#fffdf4,#e8ddc4 72%,#d0bc92);color:#20221e;box-shadow:0 5px 12px #00150c9c;user-select:none;touch-action:pan-y;transition:transform .18s,filter .18s}.card:after{content:"";position:absolute;inset:3px;border:1px solid #b9a781;border-radius:6px;pointer-events:none}.red{color:#b52a34}.corner{font-weight:bold;font-size:clamp(12px,3.2vw,19px);line-height:1;z-index:1}.corner span{font-size:.85em}.pip{align-self:center;font-size:clamp(27px,7vw,42px);z-index:1}.bottom{align-self:flex-end;transform:rotate(180deg)}.handwrap{position:absolute;bottom:4px;left:0;right:0;height:clamp(140px,26vh,192px);display:flex;align-items:flex-end;padding:0 5px 9px}.hand{display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%}.hand .card{width:clamp(40px,11.4vw,75px);height:clamp(75px,18.5vh,122px);margin-left:clamp(-23px,-4vw,-7px);flex-shrink:0;cursor:pointer}.hand .card:first-child{margin-left:0}.hand .selected{transform:translateY(-18px);outline:3px solid #f3d16d;z-index:3;filter:brightness(1.05)}.hand .corner{font-size:clamp(10px,2.9vw,16px)}.hand .pip{font-size:clamp(21px,6vw,36px)}.controls{position:absolute;z-index:3;bottom:clamp(139px,26vh,195px);left:0;right:0;display:flex;justify-content:center;gap:5px}.controls button{font-size:10px;padding:9px 10px}#toast{position:absolute;z-index:3;bottom:clamp(200px,34vh,250px);left:50%;transform:translateX(-50%);font:bold 12px Arial;color:#ffefb7;text-shadow:0 2px 4px #000;white-space:nowrap}.modal{display:none;position:absolute;inset:0;z-index:10;background:#000b;align-items:center;justify-content:center;padding:18px}.box{width:min(380px,100%);max-height:90dvh;overflow:auto;background:linear-gradient(#302316,#100c08);border:2px solid #d2ae5d;border-radius:18px;padding:20px;text-align:left;box-shadow:0 20px 60px #000}.box h2{text-align:center;color:#f4d58d;margin-top:0}.box p{font:13px/1.5 Arial;color:#e0d2b5;white-space:pre-line}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0;font:13px Arial}.row select,.row input{max-width:170px;padding:8px;border-radius:8px;background:#24180e;color:#f4e5c4;border:1px solid #b58a42}.box .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.win{animation:winpulse .7s ease-in-out 3}@keyframes drop{from{transform:translateY(-30px) scale(.8);opacity:.2}to{transform:translateY(0) scale(1);opacity:1}}@keyframes winpulse{50%{filter:brightness(1.6);transform:scale(1.025)}}@media(min-width:760px){.zone{left:28%;right:28%}.slot{width:90px;height:132px}.handwrap{height:190px}.controls{bottom:193px}.left{left:18%}.right{right:18%}}
</style></head><body><div id="app">
<section id="menu"><h1 class="logo">БЕЛКА</h1><div class="sub">HD · КАРТОЧНЫЙ СТОЛ</div><div class="menus"><button id="start">♠<br>Новая игра<br><small>против ботов</small></button><button id="settings">⚙<br>Настройки<br><small>колода и стол</small></button><button id="online">🌐<br>Онлайн<br><small>игра с друзьями</small></button><button id="rules">♜<br>Правила<br><small>как играть</small></button></div><div class="note">4 игрока · команды 2×2 · 32 игровые карты<br>В настройках можно выбрать набор правил.</div></section>
<section id="game"><div class="topbar"><button id="home">⌂</button><div class="pill" id="trump">КОЗЫРЬ ♣</div><button id="help">?</button></div><div class="seat top">МОЙША<small>соперник</small><div class="backs" id="b2"></div></div><div class="seat left">ФРАЕРОК<small>соперник</small><div class="backs" id="b1"></div></div><div class="seat right">ПАРТНЁР<small>твоя команда</small><div class="backs" id="b3"></div></div><div id="score">Команда 1: 0 · Команда 2: 0</div><div id="message">Твой ход</div><div class="zone"><div class="oval"></div><div class="plays" id="table"></div></div><div id="toast"></div><div class="controls"><button id="play">▶ СЫГРАТЬ</button><button id="sort">↕ СОРТИРОВАТЬ</button><button id="deal">↻ НОВАЯ СДАЧА</button></div><div class="handwrap"><div class="hand" id="hand"></div></div></section>
<div class="modal" id="modal"><div class="box"><h2 id="mt"></h2><p id="mp"></p><div id="extra"></div><div class="actions"><button id="saveSettings" style="display:none">СОХРАНИТЬ</button><button id="close">ЗАКРЫТЬ</button></div></div></div></div>
<script>
const SUITS=['♠','♥','♦','♣'],RANKS=['7','8','9','10','J','Q','K','A'],NAMES=['ТЫ','ФРАЕРОК','МОЙША','ПАРТНЁР'];const $=id=>document.getElementById(id);
let cfg={variant:'classic',deck:'classic',back:'green',sound:false},G=null;
const POINTS={'A':11,'10':10,'K':4,'Q':3,'J':2,'9':0,'8':0,'7':0};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function fullDeck(){return shuffle(SUITS.flatMap(s=>RANKS.map(r=>({s,r,id:r+s}))))}
function newGame(){G={hands:[[],[],[],[]],trump:SUITS[Math.random()*4|0],turn:Math.random()*4|0,lead:0,trick:[],scores:[0,0],tricks:[0,0],sel:-1,locked:false,seen:[],history:[],deal:1,firstJack:0};let d=fullDeck();for(let i=0;i<32;i++)G.hands[i%4].push(d[i]);G.hands.forEach(h=>h.sort((a,b)=>SUITS.indexOf(a.s)-SUITS.indexOf(b.s)||RANKS.indexOf(a.r)-RANKS.indexOf(b.r)));G.lead=G.turn;G.firstJack=G.hands.findIndex(h=>h.some(c=>c.id==='J♣'));$('menu').style.display='none';$('game').style.display='block';$('table').classList.remove('win');$('toast').textContent='';$('trump').textContent='КОЗЫРЬ '+G.trump;paint();say(G.turn===0?'Твой ход':NAMES[G.turn]+' начинает');if(G.turn!==0){G.locked=true;setTimeout(botStep,650)}}
function card(c,i,sel=false){return '<div class="card '+('♥♦'.includes(c.s)?'red ':'')+(sel?'selected':'')+'" data-i="'+i+'"><div class="corner">'+c.r+'<br><span>'+c.s+'</span></div><div class="pip">'+c.s+'</div><div class="corner bottom">'+c.r+'<br><span>'+c.s+'</span></div></div>'}
function paint(){if(!G)return;$('hand').innerHTML=G.hands[0].map((c,i)=>card(c,i,i===G.sel)).join('');[...$('hand').children].forEach(el=>{el.onclick=()=>{if(G.locked)return;G.sel=+el.dataset.i;paint()};let x=0;el.ontouchstart=e=>x=e.touches[0].clientX;el.ontouchend=e=>{if(Math.abs(e.changedTouches[0].clientX-x)>55){G.sel=+el.dataset.i;humanPlay()}}});$('table').innerHTML=G.trick.map(t=>'<div class="slot">'+card(t.c,-1)+'<span class="slotname">'+NAMES[t.p]+'</span></div>').join('');[1,2,3].forEach(p=>$('b'+p).innerHTML=G.hands[p].map(()=>'<span class="back"></span>').join(''));$('trump').textContent='КОЗЫРЬ '+G.trump;$('score').textContent='Команда 1: '+G.scores[0]+' ('+G.tricks[0]+' вз.) · Команда 2: '+G.scores[1]+' ('+G.tricks[1]+' вз.)';$('play').disabled=G.locked||G.turn!==0||G.sel<0}
function say(s){$('message').textContent=s}
function isPermanentTrump(c){return c.r==='J'}
function rankValue(c,lead){if(c.r==='J'){return 200+({'♣':4,'♠':3,'♥':2,'♦':1}[c.s]||0)}if(c.s===G.trump)return 100+RANKS.indexOf(c.r);if(c.s===lead)return 20+RANKS.indexOf(c.r);return RANKS.indexOf(c.r)}
function legal(p){let h=G.hands[p];if(!G.trick.length)return h.slice();let lead=G.trick[0].c.s;let same=h.filter(c=>c.s===lead);return same.length?same:h.slice()}
function humanPlay(){if(!G||G.locked||G.turn!==0||G.sel<0)return;let c=G.hands[0][G.sel];if(!legal(0).some(x=>x.id===c.id)){say('Нужно положить карту масти захода');return}doPlay(0,c)}
function doPlay(p,c){let ix=G.hands[p].findIndex(x=>x.id===c.id);if(ix<0)return;G.hands[p].splice(ix,1);G.seen.push(c);G.history.push({p,c});G.trick.push({p,c});G.sel=-1;G.turn=(p+1)%4;paint();if(G.trick.length===4){G.locked=true;say('Считаем взятку…');setTimeout(resolveTrick,700)}else if(G.turn===0){G.locked=false;say('Твой ход — выбери карту');paint()}else{G.locked=true;say(NAMES[G.turn]+' ходит…');setTimeout(botStep,420+Math.random()*350)}}
function botChoose(p){let legalCards=legal(p);if(!G.trick.length){let nonTrump=legalCards.filter(c=>c.s!==G.trump&&c.r!=='J');let low=(nonTrump.length?nonTrump:legalCards).slice().sort((a,b)=>rankValue(a,'')-rankValue(b,''));return low[0]}let lead=G.trick[0].c.s;let current=G.trick.reduce((a,t)=>rankValue(t.c,lead)>rankValue(a.c,lead)?t:a,G.trick[0]);let winning=legalCards.filter(c=>rankValue(c,lead)>rankValue(current.c,lead));let partnerAhead=G.trick.some(t=>t.p%2===p%2&&rankValue(t.c,lead)===rankValue(current.c,lead));if(partnerAhead||!winning.length)return legalCards.slice().sort((a,b)=>rankValue(a,lead)-rankValue(b,lead))[0];return winning.sort((a,b)=>rankValue(a,lead)-rankValue(b,lead))[0]}
function botStep(){if(!G||!G.locked)return;if(G.turn===0){G.locked=false;say('Твой ход — выбери карту');paint();return}let p=G.turn,c=botChoose(p);doPlay(p,c)}
function resolveTrick(){if(!G||G.trick.length!==4)return;let lead=G.trick[0].c.s;let w=G.trick.reduce((a,t)=>rankValue(t.c,lead)>rankValue(a.c,lead)?t:a,G.trick[0]);let team=w.p%2;let pts=G.trick.reduce((n,t)=>n+(POINTS[t.c.r]||0),0);G.scores[team]+=pts;G.tricks[team]++;G.lead=w.p;G.turn=w.p;G.trick=[];G.locked=false;$('toast').textContent=NAMES[w.p]+' взял взятку · +'+pts;$('table').classList.add('win');paint();if(G.hands.every(h=>h.length===0)){G.scores[team]+=10;let result=G.scores[0]===G.scores[1]?'Ничья':G.scores[0]>G.scores[1]?'Победа твоей команды!':'Победа соперников';setTimeout(()=>modal('🏆 Раунд завершён',result+'\nКоманда 1: '+G.scores[0]+' очков\nКоманда 2: '+G.scores[1]+' очков\nВзятки: '+G.tricks[0]+' : '+G.tricks[1]+'\n\nНажми «Новая сдача», чтобы сыграть снова.'),450);return}say(team===0?'Взятка твоей команды':'Взятка соперников');setTimeout(()=>{$('table').classList.remove('win');$('toast').textContent='';if(G.turn===0){say('Твой ход');paint()}else{G.locked=true;botStep()}},850)}
function sortHand(){if(!G)return;G.hands[0].sort((a,b)=>SUITS.indexOf(a.s)-SUITS.indexOf(b.s)||RANKS.indexOf(a.r)-RANKS.indexOf(b.r));G.sel=-1;paint()}
function modal(t,p,extra=''){ $('mt').textContent=t;$('mp').textContent=p;$('extra').innerHTML=extra;$('modal').style.display='flex'}
function settingsModal(){let ex='<div class="row"><label>Правила</label><select id="variant"><option value="classic">Классическая Белка (базовая)</option><option value="simple">Упрощённый вариант</option></select></div><div class="row"><label>Рубашка</label><select id="back"><option value="green">Изумрудная</option><option value="red">Бордовая</option><option value="blue">Синяя</option></select></div><div class="row"><label>Звуки</label><select id="sound"><option value="off">Выключены</option><option value="on">Включены</option></select></div><div class="row"><label>Анимации</label><select id="anim"><option value="on">Включены</option><option value="off">Выключены</option></select></div>';modal('Настройки','Выбери оформление и набор правил. Для точного совпадения с твоей локальной версией правила ещё нужно подтвердить.',ex);$('saveSettings').style.display='inline-block';$('close').textContent='ОТМЕНА';$('saveSettings').onclick=()=>{cfg.variant=$('variant').value;cfg.back=$('back').value;cfg.sound=$('sound').value==='on';document.documentElement.style.setProperty('--back',cfg.back==='red'?'#6c2430':cfg.back==='blue'?'#214a80':'#164b3a');$('modal').style.display='none';$('saveSettings').style.display='none';$('close').textContent='ЗАКРЫТЬ'} }
function onlineModal(){modal('Онлайн с друзьями','Онлайн-режим требует Firebase или другого сервера для комнат, синхронизации ходов и защиты от подмены карт. Репозиторий пока статический, поэтому комнаты ещё не подключены. Можно подготовить подключение бесплатно на Firebase Spark, но для реальной игры нужны настройки проекта и ключи.\n\nСледующий шаг: создать Firebase-проект, включить Anonymous Authentication и Realtime Database, затем добавить конфигурацию в приложение.');}
$('start').onclick=newGame;$('deal').onclick=newGame;$('play').onclick=humanPlay;$('sort').onclick=sortHand;$('home').onclick=()=>{$('game').style.display='none';$('menu').style.display='flex'};$('rules').onclick=()=>modal('Правила Белки — важное уточнение','В Казахстане есть несколько вариантов правил. Распространённая версия использует 36-карточную колоду, из которой 6-ки не разыгрываются и служат для счёта; играют 32 картами, по 8 на игрока. Валеты — постоянные козыри с порядком ♣J > ♠J > ♥J > ♦J. Очки карт обычно: A=11, 10=10, K=4, Q=3, J=2; всего 120. В разных вариантах различаются назначение мастей, штрафы и подсчёт «глаз». Текущая логика — рабочая база, но не окончательная реализация всех этих правил.');$('help').onclick=()=>modal('Управление','Нажми карту, затем «Сыграть» или свайпни по карте. Если есть масть захода, нужно ходить в масть. Боты выбирают карту по текущей взятке и истории уже сыгранных карт.');$('settings').onclick=settingsModal;$('online').onclick=onlineModal;$('close').onclick=()=>{$('modal').style.display='none';$('saveSettings').style.display='none';$('close').textContent='ЗАКРЫТЬ'};
</script></body></html>
